apply plugin: 'com.android.application'

android {
    namespace 'com.saedarm.kasserine'
    compileSdk 36

    defaultConfig {
        applicationId 'com.saedarm.kasserine'
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName '0.1'
    }

    sourceSets {
        main {
            manifest.srcFile 'AndroidManifest.xml'
            java.srcDirs = ['src/main/java']
            res.srcDirs = ['res']
            assets.srcDirs = [rootProject.file('assets')]
            jniLibs.srcDirs = ['libs']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

configurations { natives }

dependencies {
    implementation project(':core')
    implementation "com.badlogicgames.gdx:gdx-backend-android:$gdxVersion"
    implementation "com.badlogicgames.gdx-controllers:gdx-controllers-android:$gdxControllersVersion"
    natives "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-armeabi-v7a"
    natives "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-arm64-v8a"
    natives "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-x86_64"
}

// Unpack the libGDX native .so files into android/libs before building.
tasks.register('copyAndroidNatives') {
    doFirst {
        configurations.natives.copy().files.each { jar ->
            def abi = jar.name.replaceAll(/.*natives-(.*)\.jar/, '$1')
            def out = file("libs/$abi")
            out.mkdirs()
            copy {
                from zipTree(jar)
                into out
                include '*.so'
            }
        }
    }
}
tasks.matching { it.name.contains('merge') && it.name.contains('JniLibFolders') }.configureEach {
    dependsOn 'copyAndroidNatives'
}
