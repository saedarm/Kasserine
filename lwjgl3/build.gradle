apply plugin: 'application'

dependencies {
    implementation project(':core')
    implementation "com.badlogicgames.gdx:gdx-backend-lwjgl3:$gdxVersion"
    implementation "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-desktop"
    implementation "com.badlogicgames.gdx-controllers:gdx-controllers-desktop:$gdxControllersVersion"
}

// Put assets/ on the classpath, so sounds load however the game is started:
// gradlew run, the jar, or the green arrow next to main() in Android Studio/IntelliJ.
sourceSets.main.resources.srcDirs += rootProject.file('assets')

application {
    mainClass = 'com.saedarm.kasserine.lwjgl3.Lwjgl3Launcher'
}

tasks.named('run') {
    workingDir = rootProject.file('assets')
    // macOS needs this for LWJGL3
    if (System.getProperty('os.name').toLowerCase().contains('mac')) jvmArgs '-XstartOnFirstThread'
}

// One runnable jar with everything inside: code, libGDX, natives and assets.
//   ./gradlew lwjgl3:dist   ->   lwjgl3/build/libs/Kasserine-desktop.jar
//   java -jar lwjgl3/build/libs/Kasserine-desktop.jar
tasks.register('dist', Jar) {
    group = 'distribution'
    description = 'Builds a single runnable jar for desktop.'
    archiveFileName = 'Kasserine-desktop.jar'
    manifest { attributes 'Main-Class': application.mainClass.get() }
    dependsOn configurations.runtimeClasspath, classes
    from sourceSets.main.output
    from { configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) } }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA', 'META-INF/INDEX.LIST'
}
